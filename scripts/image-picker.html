<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de imágenes</title>
<style>
  :root { --bg:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#111827; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#f3f4f6; --muted:#9ca3af; --line:#2a2f3a; --accent:#f3f4f6; } }
  * { box-sizing: border-box }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg) }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); cursor:pointer }
  button:hover { border-color:var(--accent) }
  button:disabled { opacity:.4; cursor:default }
  .count { font-weight:600 }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; padding:16px }
  .card { position:relative; border:2px solid transparent; border-radius:10px; overflow:hidden; cursor:pointer; background:var(--line); aspect-ratio:4/3 }
  .card img { width:100%; height:100%; object-fit:cover; display:block }
  .card.sel { border-color:var(--ok) }
  .card .id { position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.65); color:#fff; font-size:12px; padding:2px 6px; border-radius:6px }
  .card .tick { position:absolute; right:6px; top:6px; background:var(--ok); color:#fff; width:24px; height:24px; border-radius:50%; display:none; align-items:center; justify-content:center; font-weight:700 }
  .card.sel .tick { display:flex }
  .card .zoom { position:absolute; left:6px; top:6px; background:rgba(0,0,0,.65); color:#fff; font-size:12px; padding:2px 6px; border-radius:6px; text-decoration:none }
  #out { width:100%; font-family:ui-monospace,monospace; font-size:12px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg) }
  .msg { color:var(--muted); padding:16px }
</style>
</head>
<body>
<header>
  <button id="prev">←</button>
  <span id="page">Página 1</span>
  <button id="next">→</button>
  <label><input type="checkbox" id="onlySel"> Solo seleccionadas</label>
  <span class="count" id="count">0 seleccionadas</span>
  <button id="copy">Copiar IDs</button>
  <button id="clear">Limpiar</button>
  <input id="out" readonly placeholder="IDs seleccionados">
</header>
<div id="msg" class="msg">Cargando…</div>
<div id="grid" class="grid"></div>
<script>
const KEY = 'picsum-selected'
const PER_PAGE = 48
let page = 1
let selected = new Set()
try { selected = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')) } catch {}

const $ = (id) => document.getElementById(id)
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...selected])) } catch {} }
const thumb = (id) => `https://picsum.photos/id/${id}/400/300`

function updateHeader() {
  const ids = [...selected].sort((a, b) => a - b)
  $('count').textContent = `${ids.length} seleccionadas`
  $('out').value = ids.join(', ')
  $('page').textContent = `Página ${page}`
  $('prev').disabled = page <= 1
}

function render(items) {
  const grid = $('grid')
  grid.innerHTML = ''
  for (const it of items) {
    const id = Number(it.id)
    const card = document.createElement('div')
    card.className = 'card' + (selected.has(id) ? ' sel' : '')
    card.innerHTML = `<img loading="lazy" src="${thumb(id)}" alt="${id}"><span class="id">#${id}</span><span class="tick">✓</span><a class="zoom" href="https://picsum.photos/id/${id}/1200/800" target="_blank" rel="noopener">ver</a>`
    card.addEventListener('click', (e) => {
      if (e.target.closest('.zoom')) return
      if (selected.has(id)) selected.delete(id); else selected.add(id)
      card.classList.toggle('sel')
      save(); updateHeader()
    })
    grid.appendChild(card)
  }
}

async function load() {
  $('msg').textContent = 'Cargando…'
  updateHeader()
  if ($('onlySel').checked) {
    $('msg').textContent = ''
    render([...selected].sort((a, b) => a - b).map((id) => ({ id })))
    return
  }
  try {
    const res = await fetch(`https://picsum.photos/v2/list?page=${page}&limit=${PER_PAGE}`)
    const items = await res.json()
    $('msg').textContent = items.length ? '' : 'No hay más imágenes.'
    $('next').disabled = items.length < PER_PAGE
    render(items)
  } catch {
    $('msg').textContent = 'No se pudo cargar la lista de picsum.photos.'
  }
}

$('prev').onclick = () => { page--; load(); scrollTo(0, 0) }
$('next').onclick = () => { page++; load(); scrollTo(0, 0) }
$('onlySel').onchange = load
$('clear').onclick = () => { selected.clear(); save(); load() }
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('out').value); $('copy').textContent = 'Copiado' } catch { $('out').select() }
  setTimeout(() => ($('copy').textContent = 'Copiar IDs'), 1500)
}
load()
</script>
</body>
</html>
